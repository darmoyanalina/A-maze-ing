[project]
name = "amazing"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name",email = "you@example.com"}
]
readme = "README.md"
requires-python = ">=3.10"
# 1. Tell Poetry 2.0 to look at the tool section for dependencies
dynamic = [ "dependencies" ] 

# 2. Make sure the old "dependencies = [...]" array is COMPLETELY REMOVED from this section

[tool.poetry]
package-mode = false

# 3. Put all your dependencies together down here
[tool.poetry.dependencies]
python = ">=3.10"
numpy = "==2.2.6"
pydantic = "==2.13.4"
mazegen = { file = "mazegen-0.1.0.tar.gz" }

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"